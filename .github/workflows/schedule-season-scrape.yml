name: Euroleague data bundle

# Daily incremental scrape of the current EuroLeague season into data/el_<season>.rds,
# plus a manual "Run workflow" button that also offers a one-time FULL bootstrap.
#
# First time:  Actions -> this workflow -> Run workflow -> mode = full   (builds el_E2026.rds)
# After that:  the daily cron runs mode = incremental automatically (only new games).

on:
  schedule:
    - cron: "0 5 * * *"       # 05:00 UTC daily, after the previous night's games
                              # (GitHub may delay scheduled runs by a few minutes)
  workflow_dispatch:
    inputs:
      mode:
        description: "full = first-time bootstrap of the season; incremental = only new games"
        type: choice
        options: [incremental, full]
        default: incremental
      season:
        description: "Season code to scrape"
        default: E2026

# Scheduled runs carry no inputs, so fall back to the daily defaults.
env:
  MODE: ${{ github.event.inputs.mode || 'incremental' }}
  SEASON: ${{ github.event.inputs.season || 'E2026' }}

permissions:
  contents: write            # needed to commit the refreshed data/el_<season>.rds

concurrency:
  group: scrape-current-season   # never let two scrapes run / push at once
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true     # fast binary packages

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::purrr
            any::tidyr
            any::stringr
            any::stringi
            any::httr
            any::jsonlite
            any::glue
            any::janitor
            any::zip

      - name: Scrape (${{ env.MODE }}) ${{ env.SEASON }} -> data/el_${{ env.SEASON }}.rds
        run: Rscript scrapers/run_scrape_all.R "$MODE" "$SEASON"

      - name: Commit the updated season bundle (only data/el_<season>.rds)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "data/el_${SEASON}.rds"
          if git diff --cached --quiet; then
            echo "No change in data/el_${SEASON}.rds - nothing to commit."
          else
            git commit -m "data: ${MODE} scrape ${SEASON} $(date -u +'%Y-%m-%d %H:%MZ')"
            git push
          fi
