name: FPM Data Builder

# Daily pipeline for the current EuroLeague season:
#   scrape new games -> data/el_<season>.rds
#   build stints     -> stints/stints_<season>.rds   (the RAPM input)
# plus a manual "Run workflow" button that also offers a one-time FULL bootstrap.
#
# First time:  Actions -> this workflow -> Run workflow -> mode = full   (builds E2026)
# After that:  the daily cron runs mode = incremental automatically (only new games).

on:
  schedule:
    - cron: "0 2 * * *"       # 05:00 UTC daily, after the previous night's games
                              # (GitHub may delay scheduled runs by a few minutes)
  workflow_dispatch:
    inputs:
      mode:
        description: "full = first-time bootstrap of the season; incremental = only new games"
        type: choice
        options: [incremental, full]
        default: incremental
      season:
        description: "Season code to scrape"
        default: E2026

# Scheduled runs carry no inputs, so fall back to the daily defaults.
env:
  MODE: ${{ github.event.inputs.mode || 'incremental' }}
  SEASON: ${{ github.event.inputs.season || 'E2026' }}
  # Install packages into a dedicated, cached library (see the cache step below).
  R_LIBS_USER: ${{ github.workspace }}/.rlib

permissions:
  contents: write            # needed to commit the refreshed .rds files

concurrency:
  group: scrape-current-season   # never let two runs push at once
  cancel-in-progress: false

jobs:
  scrape:
    # Pinned to 24.04 on purpose. `ubuntu-latest` has migrated to Ubuntu 26.04,
    # whose newer ICU (libicui18n.so.76) breaks the Posit binary `stringi`, which
    # is built against 24.04's ICU 74 -> "libicui18n.so.74: cannot open shared
    # object file" when stringr/stringi load. Staying on 24.04 keeps the system
    # ICU in step with the binary packages. Revisit when P3M ships 26.04 binaries.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so the rebase + push below is clean

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true     # Posit binary packages (no source compiles)

      # Cache the installed package library across runs. The key pins the runner
      # OS so the cache is rebuilt automatically if we ever move off 24.04 (the
      # ICU that compiled binaries link against is tied to the OS). Bump the
      # trailing version (-v3 -> -v4) if you change the package list or R.
      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-pkgs-ubuntu-24.04-v3
          restore-keys: r-pkgs-ubuntu-24.04-

      - name: Install missing R packages
        shell: Rscript {0}
        run: |
          lib <- Sys.getenv("R_LIBS_USER")
          dir.create(lib, showWarnings = FALSE, recursive = TRUE)
          .libPaths(lib)
          pkgs <- c("dplyr","purrr","tidyr","stringr","stringi",
                    "httr","jsonlite","glue","janitor","zip")
          miss <- setdiff(pkgs, rownames(installed.packages()))
          if (length(miss)) install.packages(miss) else message("all packages cached - skipping install")

      - name: Scrape (${{ env.MODE }}) ${{ env.SEASON }} -> data/el_${{ env.SEASON }}.rds
        run: Rscript scrapers/run_scrape_all.R "$MODE" "$SEASON"

      - name: Build stints -> stints/stints_${{ env.SEASON }}.rds
        run: |
          if [ "$MODE" = "full" ]; then
            Rscript stints/build_stints.R "$SEASON"
          else
            Rscript stints/build_stints.R incremental "$SEASON"
          fi

      - name: Commit refreshed data + stints
        env:
          GIT_EDITOR: "true"     # stop `rebase --continue` from opening an editor
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add "data/el_${SEASON}.rds" "stints/stints_${SEASON}.rds"
          if git diff --cached --quiet; then
            echo "No changes - nothing to commit."
            exit 0
          fi
          git commit -m "data: ${MODE} ${SEASON} $(date -u +%F)"

          # Push; if main gained commits since checkout (a docs push, or the
          # engine writing the leaderboard back), rebase our data commit on top
          # of the new main and retry. This is what fixes the non-fast-forward
          # "! [rejected] main -> main (fetch first)" failure.
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push rejected (attempt $i). Rebasing on latest main..."
            git fetch origin main
            # .rds files are binary and cannot auto-merge. In the rare case the
            # newer main touched the SAME .rds files, keep THIS run's fresh
            # output (during a rebase, --theirs is the commit being replayed).
            if ! git rebase --autostash origin/main; then
              git checkout --theirs -- "data/el_${SEASON}.rds" "stints/stints_${SEASON}.rds"
              git add "data/el_${SEASON}.rds" "stints/stints_${SEASON}.rds"
              git rebase --continue
            fi
          done
          echo "Push still failing after 5 attempts."
          exit 1

      - name: Trigger the FPM engine
        if: success()
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.ENGINE_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/filippospol/FPM-model/dispatches \
            -d "{\"event_type\":\"public-data-updated\",\"client_payload\":{\"season\":\"${SEASON}\"}}"
