name: FPM Data Builder

# Daily pipeline for the current EuroLeague season:
#   scrape new games -> data/el_<season>.rds
#   build stints     -> stints/stints_<season>.rds   (the RAPM input)
# plus a manual "Run workflow" button that also offers a one-time FULL bootstrap.
#
# First time:  Actions -> this workflow -> Run workflow -> mode = full   (builds E2026)
# After that:  the daily cron runs mode = incremental automatically (only new games).

on:
  schedule:
    - cron: "0 5 * * *"       # 05:00 UTC daily, after the previous night's games
                              # (GitHub may delay scheduled runs by a few minutes)
  workflow_dispatch:
    inputs:
      mode:
        description: "full = first-time bootstrap of the season; incremental = only new games"
        type: choice
        options: [incremental, full]
        default: incremental
      season:
        description: "Season code to scrape"
        default: E2026

# Scheduled runs carry no inputs, so fall back to the daily defaults.
env:
  MODE: ${{ github.event.inputs.mode || 'incremental' }}
  SEASON: ${{ github.event.inputs.season || 'E2026' }}

permissions:
  contents: write            # needed to commit the refreshed .rds files

concurrency:
  group: scrape-current-season   # never let two runs push at once
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true     # fast binary packages

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::purrr
            any::tidyr
            any::stringr
            any::stringi
            any::httr
            any::jsonlite
            any::glue
            any::janitor
            any::zip

      - name: Scrape (${{ env.MODE }}) ${{ env.SEASON }} -> data/el_${{ env.SEASON }}.rds
        run: Rscript scrapers/run_scrape_all.R "$MODE" "$SEASON"

      - name: Build stints -> stints/stints_${{ env.SEASON }}.rds
        run: |
          if [ "$MODE" = "full" ]; then
            Rscript analysis/build_stints.R "$SEASON"
          else
            Rscript analysis/build_stints.R incremental "$SEASON"
          fi

      - name: Commit refreshed data + stints
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "data/el_${SEASON}.rds" "stints/stints_${SEASON}.rds"
          if git diff --cached --quiet; then
            echo "No changes - nothing to commit."
          else
            git commit -m "data: ${MODE} ${SEASON} $(date -u +'%Y-%m-%d %H:%MZ')"
            git push
          fi
